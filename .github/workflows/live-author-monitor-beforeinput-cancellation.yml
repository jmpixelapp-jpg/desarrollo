name: Live Author Monitor — beforeinput cancellation

on:
  push:
    branches: [main]
    paths:
      - "base de datos/Motor-Literario/typescript/src/live-author-monitor-textarea-source.ts"
      - "base de datos/Motor-Literario/typescript/tests/live-author-monitor-beforeinput-cancellation-browser.test.mjs"
      - "base de datos/Motor-Literario/typescript/tests/browser/live-author-monitor-ime-manual.html"
      - ".github/workflows/live-author-monitor-beforeinput-cancellation.yml"
  pull_request:
    paths:
      - "base de datos/Motor-Literario/typescript/src/live-author-monitor-textarea-source.ts"
      - "base de datos/Motor-Literario/typescript/tests/live-author-monitor-beforeinput-cancellation-browser.test.mjs"
      - "base de datos/Motor-Literario/typescript/tests/browser/live-author-monitor-ime-manual.html"
      - ".github/workflows/live-author-monitor-beforeinput-cancellation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beforeinput-cancellation:
    name: Validate trusted Chromium input cancellation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "base de datos/Motor-Literario/typescript"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install development tools
        run: npm install --no-audit --no-fund
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Test late beforeinput cancellation and next real edit
        run: node --test tests/live-author-monitor-beforeinput-cancellation-browser.test.mjs
