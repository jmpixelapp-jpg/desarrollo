name: Live Author Monitor

on:
  push:
    branches: [main]
    paths:
      - "base de datos/Motor-Literario/typescript/src/live-author-monitor*.ts"
      - "base de datos/Motor-Literario/typescript/src/host-api.ts"
      - "base de datos/Motor-Literario/typescript/src/contracts.ts"
      - "base de datos/Motor-Literario/typescript/src/engine.ts"
      - "base de datos/Motor-Literario/typescript/src/persistence/indexeddb-store.ts"
      - "base de datos/Motor-Literario/MLDB/storage_mapping_v0.4.2.json"
      - "base de datos/Motor-Literario/typescript/tests/live-author-monitor*.test.mjs"
      - "base de datos/Motor-Literario/typescript/tests/browser/**"
      - "base de datos/Motor-Literario/typescript/examples/live-author-monitor/**"
      - "base de datos/Motor-Literario/typescript/tests/storage-implementation-audit.test.mjs"
      - ".github/workflows/live-author-monitor.yml"
  pull_request:
    paths:
      - "base de datos/Motor-Literario/typescript/src/live-author-monitor*.ts"
      - "base de datos/Motor-Literario/typescript/src/host-api.ts"
      - "base de datos/Motor-Literario/typescript/src/contracts.ts"
      - "base de datos/Motor-Literario/typescript/src/engine.ts"
      - "base de datos/Motor-Literario/typescript/src/persistence/indexeddb-store.ts"
      - "base de datos/Motor-Literario/MLDB/storage_mapping_v0.4.2.json"
      - "base de datos/Motor-Literario/typescript/tests/live-author-monitor*.test.mjs"
      - "base de datos/Motor-Literario/typescript/tests/browser/**"
      - "base de datos/Motor-Literario/typescript/examples/live-author-monitor/**"
      - "base de datos/Motor-Literario/typescript/tests/storage-implementation-audit.test.mjs"
      - ".github/workflows/live-author-monitor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-author-monitor:
    name: Build and test live author monitor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "base de datos/Motor-Literario/typescript"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install development tools
        run: npm install --no-audit --no-fund
      - name: Install Chromium for cross-tab browser tests
        run: npx playwright install --with-deps chromium
      - name: Validate MLDB schema and physical storage mapping
        run: npm run validate:schema
      - name: Build runtime bundle
        run: npx vite build
      - name: Run monitor-specific tests
        run: node --test tests/live-author-monitor*.test.mjs tests/storage-implementation-audit.test.mjs
      - name: Measure bounded monitor heap across large documents
        run: npm run bench:monitor
