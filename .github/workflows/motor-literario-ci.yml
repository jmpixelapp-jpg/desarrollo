name: Motor Literario - CI

on:
  push:
    branches:
      - main
    paths:
      - "base de datos/Motor-Literario/**"
      - ".github/workflows/motor-literario-ci.yml"
  pull_request:
    paths:
      - "base de datos/Motor-Literario/**"
      - ".github/workflows/motor-literario-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, build, schema, tests and live-edit benchmark
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: base de datos/Motor-Literario/typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test suite
        run: npm test
      - name: Live-edit benchmark
        run: npm run bench
