name: Motor Literario TypeScript

on:
  push:
    branches: [main]
    paths:
      - "base de datos/Motor-Literario/**"
      - ".github/workflows/motor-literario-typescript.yml"
  pull_request:
    paths:
      - "base de datos/Motor-Literario/**"
      - ".github/workflows/motor-literario-typescript.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-tests:
    name: TypeScript build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "base de datos/Motor-Literario/typescript"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install development tools
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Run broadcast channel lifecycle regression independently
        if: always()
        run: npm run test:sync-lifecycle
      - name: Build and run automated tests
        run: npm test
      - name: Run live-edit benchmark
        run: npm run bench
