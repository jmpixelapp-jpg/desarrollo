name: Motor Literario TypeScript

on:
  push:
    branches: [main]
    paths:
      - "base de datos/Motor-Literario/**"
      - ".github/workflows/motor-literario-typescript.yml"
  pull_request:
    paths:
      - "base de datos/Motor-Literario/**"
      - ".github/workflows/motor-literario-typescript.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-tests:
    name: TypeScript build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "base de datos/Motor-Literario/typescript"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install development tools
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Build TypeScript distribution
        run: npm run build
      - name: Run focused narrative graph and analysis regressions
        run: node --test tests/idea-graph-complete-catalog.test.mjs tests/idea-lexical-resonance.test.mjs tests/literary-analysis.test.mjs tests/idea-reference-limits.test.mjs tests/storage-implementation-audit.test.mjs
      - name: Run complete automated test suite
        run: npm run validate:schema && node --test tests/*.test.mjs test/*.test.mjs
      - name: Run live-edit benchmark
        run: npm run bench
