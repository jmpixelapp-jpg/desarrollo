name: Narrative storage integrity

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/narrative-storage-integrity.yml"
      - "base de datos/Motor-Literario/typescript/package.json"
      - "base de datos/Motor-Literario/typescript/src/persistence/**"
      - "base de datos/Motor-Literario/typescript/tests/indexeddb-idea-transaction.test.mjs"
      - "base de datos/Motor-Literario/typescript/tests/indexeddb-narrative-reference-integrity.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexeddb-narrative-integrity:
    name: IndexedDB narrative persistence regressions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "base de datos/Motor-Literario/typescript"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install development tools
        run: npm install --no-audit --no-fund

      # Vite transpiles the runtime bundle without running the repository-wide
      # TypeScript checker. The main workflow remains responsible for type safety.
      - name: Build runtime bundle
        run: npx vite build

      - name: Test narrative storage integrity
        run: node --test tests/indexeddb-narrative-reference-integrity.test.mjs tests/indexeddb-idea-transaction.test.mjs
