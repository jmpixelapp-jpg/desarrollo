name: Archived Rust prototype (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Workspace tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Select stable Rust
        run: rustup default stable
      - name: Compile and run workspace tests
        shell: bash
        working-directory: Motor-Literario
        run: |
          set -o pipefail
          cargo test --workspace --all-targets --locked 2>&1 | tee cargo-test.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mldb-storage-test-log-${{ matrix.os }}
          path: Motor-Literario/cargo-test.log
          if-no-files-found: ignore
          retention-days: 7
