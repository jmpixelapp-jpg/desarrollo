name: Motor Literario TypeScript CI

on:
  push:
    branches: [main]
    paths:
      - "Motor-Literario/typescript/**"
      - ".github/workflows/motor-literario-typescript.yml"
  pull_request:
    paths:
      - "Motor-Literario/typescript/**"
      - ".github/workflows/motor-literario-typescript.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Motor-Literario/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
