<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Author Monitor — IndexedDB lease harness</title>
</head>
<body>
  <main>
    <h1>Live Author Monitor browser test harness</h1>
    <p>Harness E2E de IndexedDB real. No forma parte de la interfaz de producción.</p>
    <output id="ready">starting</output>
  </main>
  <script type="module">
    import { IndexedDbProjectStore } from "/src/persistence/indexeddb-store.ts";

    const store = new IndexedDbProjectStore();
    window.__monitorLeaseHarness = Object.freeze({
      acquire: (...args) => store.acquireLiveAuthorMonitorLease(...args),
      renew: (...args) => store.renewLiveAuthorMonitorLease(...args),
      release: (...args) => store.releaseLiveAuthorMonitorLease(...args),
      saveCheckpoint: (...args) => store.saveLiveAuthorMonitorCheckpoint(...args),
      loadCheckpoint: (...args) => store.loadLiveAuthorMonitorCheckpoint(...args),
      expire: async (projectId, documentId) => {
        const db = await new Promise((resolve, reject) => {
          const request = indexedDB.open("motor-literario-local");
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
        try {
          await new Promise((resolve, reject) => {
            const transaction = db.transaction("live-author-monitor-leases", "readwrite");
            const leases = transaction.objectStore("live-author-monitor-leases");
            const request = leases.get([projectId, documentId]);
            let failure;
            request.onsuccess = () => {
              if (!request.result) {
                failure = new Error("No existe el lease que se debe expirar.");
                try { transaction.abort(); } catch {}
                return;
              }
              const now = Date.now();
              const expiredAt = Math.max(request.result.acquiredAt, now - 1);
              leases.put({ ...request.result, expiresAt: expiredAt, updatedAt: expiredAt });
            };
            request.onerror = () => {
              failure = request.error ?? new Error("No se pudo leer el lease.");
              try { transaction.abort(); } catch {}
            };
            transaction.oncomplete = () => resolve();
            transaction.onerror = () => reject(failure ?? transaction.error);
            transaction.onabort = () => reject(failure ?? transaction.error);
          });
        } finally {
          db.close();
        }
      },
      close: () => store.close()
    });
    document.querySelector("#ready").textContent = "ready";
  </script>
</body>
</html>
